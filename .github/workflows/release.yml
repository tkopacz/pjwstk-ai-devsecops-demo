name: PRE-PROD release
on:
  workflow_dispatch:
    inputs:
      candidate_pr:
        description: Green candidate PR number (human merge still required)
        required: true
        type: string
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python ci/candidate.py
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
  deploy:
    needs: candidate
    environment: PRE-PROD
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python ci/candidate.py
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          REQUIRE_MERGED: 'true'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy only the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
        run: |
          SHA=$(python ci/candidate.py | python -c 'import sys,json; print(json.load(sys.stdin)["sha"])')
          az deployment group create --resource-group rg-pjwstk-sesja-06-pr-bramki-devsecops --name approved-release --template-file infra/release.bicep --parameters releaseSha="$SHA" --only-show-errors